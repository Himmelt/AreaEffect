buildscript {
    repositories {
        maven { url 'https://files.minecraftforge.net/maven' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local' }
    }
    dependencies {
        classpath group: 'org.soraworld', name: 'ForgeGradleURI', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

ext {
    mcpRenameJavadoc = false
}

// 目标 MC 版本，切换方式：./gradlew build -PmcVersion=1.14.2
// 1.14.2 与 1.14.3 的 Java 源码完全一致，差别只在 Forge 与 MCP 映射版本
ext.mcVersion = project.findProperty('mcVersion') ?: '1.14.3'

def mcTargets = [
        '1.14.2': [forge: '1.14.2-26.0.63', mappings: '20190624-1.14.2'],
        '1.14.3': [forge: '1.14.3-27.0.60', mappings: '20200119-1.14.3']
]
def target = mcTargets[ext.mcVersion]
if (target == null) {
    throw new GradleException("不支持的 mcVersion '${ext.mcVersion}'，可选值: ${mcTargets.keySet()}")
}

version = '1.2.0'
group = 'org.soraworld.areaeffect'
archivesBaseName = "AreaEffect-${ext.mcVersion}"

sourceCompatibility = targetCompatibility = 1.8

repositories {
    maven { url 'https://files.minecraftforge.net/maven' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://lss233.littleservice.cn/repositories/minecraft' }
}

minecraft {
    mappings channel: 'snapshot', version: target.mappings
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${target.forge}"
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand 'version': project.version
    }
}

gradle.addURIListener {
    String uri = it
            .replaceAll('https://files.minecraftforge.net/maven', 'https://bmclapi2.bangbang93.com/maven')
            .replaceAll('https://libraries.minecraft.net/', 'https://mclib.mirrors.tmysam.top/')
            .replaceAll('https://launcher.mojang.com/v1/objects', 'https://mc.mirrors.tmysam.top/v1/objects')
            .replaceAll('https://resources.download.minecraft.net/cd/', 'https://mcres.mirrors.tmysam.top/cd/')
    println uri
    return uri
}
