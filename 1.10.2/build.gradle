plugins {
    id 'java'
    id 'gg.essential.loom' version '1.10.36'
}

version = '1.2.0'
group = 'org.soraworld.areaeffect'

base { archivesName = 'AreaEffect-1.10.2' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

loom {
    forge {
        pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter())
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.essential.gg/repository/maven-public/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.10.2'
    mappings 'de.oceanlabs.mcp:mcp_stable:29-1.10.2'
    forge 'net.minecraftforge:forge:1.10.2-12.18.3.2511'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.10.2'
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.10.2'
    }
}