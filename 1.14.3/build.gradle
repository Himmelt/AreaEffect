buildscript {
    repositories {
        // USTC-BMCLAPI 镜像（国内加速，兜底源）
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.14', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

ext {
    mcpRenameJavadoc = false
}

// 本工程固定构建 MC 1.14.3（Forge 27.0.60）。
// 产物也可直接在 1.14.2 (Forge 26) 上加载：两者 Java 源码一致，
// 且 mods.toml 的 loaderVersion="[26,)" 已覆盖 Forge 26+。MC 1.14/1.14.1 无 Forge 构建。

version = '1.2.0'
group = 'org.soraworld.areaeffect'
archivesBaseName = 'AreaEffect-1.14.3'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    // USTC-BMCLAPI 镜像（国内加速，兜底源）
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

minecraft {
    mappings channel: 'snapshot', version: '20200119-1.14.3'
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.14.3-27.0.60'
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand 'version': project.version
    }
}