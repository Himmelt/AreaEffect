buildscript {
    repositories {
        // Forge 官方 maven（FG4 所在的仓库，必需）
        maven { url = 'https://maven.minecraftforge.net/' }
        // USTC-BMCLAPI 镜像（国内加速，兜底源）
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.14', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

group = 'org.soraworld.areaeffect'
version = '1.2.0'
archivesBaseName = 'AreaEffect-1.13.2'

// 使用 MCP snapshot 映射（1.13.2 无官方 mojmap）
minecraft {
    mappings channel: 'snapshot', version: '20190530-1.13.2'
}

repositories {
    // USTC-BMCLAPI 镜像（国内加速，兜底源）
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
    // Forge 官方 maven
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.13.2-25.0.219'
}

jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'AreaEffect-1.13.2',
            'Implementation-Version': "${version}",
            'Specification-Title'   : 'areaeffect',
            'Specification-Version' : '1'
        ])
    }
}