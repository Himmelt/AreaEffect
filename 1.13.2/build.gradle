buildscript {
    repositories {
        // Forge 官方 maven（FG4 所在的仓库，必需）
        maven { url = 'https://maven.minecraftforge.net/' }
        // USTC-BMCLAPI 镜像（国内加速，兜底源）
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.14', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// 源码含大量中文注释，统一按 UTF-8 编译/处理资源
compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources) {
    filteringCharset = 'UTF-8'
}

group = 'org.soraworld.areaeffect'

// 版本号的唯一来源是 AreaEffectMod.MOD_VERSION：@Mod 的版本与 mods.toml 的 ${version} 必须一致，
// 这里直接解析源码常量，避免两处分别手改后漂移（与 1.12.2 分支同一约定）。
def modVersion = '1.4.0'
def modSource = file('src/main/java/org/soraworld/areaeffect/AreaEffectMod.java')
if (modSource.exists()) {
    def matcher = modSource.text =~ /MOD_VERSION\s*=\s*"([^"]+)"/
    if (matcher.find()) {
        modVersion = matcher.group(1)
    }
}
version = modVersion
archivesBaseName = 'AreaEffect-1.13.2'

// 使用 MCP snapshot 映射（1.13.2 无官方 mojmap）
minecraft {
    mappings channel: 'snapshot', version: '20190530-1.13.2'
}

repositories {
    // Maven Central 优先（镜像缺件时兜底，如 jline-reader）
    mavenCentral()
    // Forge 官方 maven
    maven { url = 'https://maven.minecraftforge.net/' }
    // USTC-BMCLAPI 镜像（国内加速）
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.13.2-25.0.219'
}

// 1.13 的模组元数据是 META-INF/mods.toml，其中的 ${version} 由构建期替换为上面的实际版本
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        filter { line ->
            line.replace('${version}', project.version.toString())
        }
    }
}

jar {
    manifest {
        attributes([
            'Implementation-Title'  : 'AreaEffect-1.13.2',
            'Implementation-Version': "${version}",
            'Specification-Title'   : 'areaeffect',
            'Specification-Version' : '1'
        ])
    }
}