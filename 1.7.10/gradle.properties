# 构建缓存与并行
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4G
# 守护进程运行 JDK（RFT 2.x 需 JDK 21+，此处用 JDK25）
org.gradle.java.home=D:/tools/dragonwell-25
# Java toolchain 自动检测路径（含 Java8 供编译 MC、Java17 供反编译使用）
org.gradle.java.installations.paths=D:/tools/dragonwell-8,D:/tools/dragonwell-17,D:/tools/dragonwell-25
